<div class="modal-ov" *ngIf="aberto" (click)="onOverlayClick($event)">
  <div class="modal-adicionar">

    <div class="modal-header">
      <div class="modal-title">
        <i class="fa-solid fa-plus"></i>
        Adicionar Estado
      </div>
      <button class="drawer-close" (click)="fecharModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Nome do Estado</label>
        <input type="text" [(ngModel)]="nome" placeholder="Ex: São Paulo" class="form-input" />
      </div>

      <div class="form-group">
        <label>Sigla (2-3 letras)</label>
        <input type="text" [(ngModel)]="sigla" maxlength="3" placeholder="Ex: SP" class="form-input sigla-input" />
      </div>

      <div class="form-group">
        <label>Código IBGE</label>
        <input type="text" [(ngModel)]="ibge" placeholder="Ex: 35" class="form-input" />
      </div>

      <div class="modal-erro" *ngIf="erro">
        <i class="fa-solid fa-triangle-exclamation"></i> {{ erro }}
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="fecharModal()">Cancelar</button>
      <button class="btn-excluir" (click)="excluirEstado()">Excluir</button>
      <button class="btn-confirmar" (click)="confirmar()">Adicionar</button>
    </div>

  </div>
</div>
