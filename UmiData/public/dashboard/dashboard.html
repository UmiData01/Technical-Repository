<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UmiData — Dashboard</title>

  <!-- Chart -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Fontes -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- LOGO -->
      <div>

        <div class="side-brand">

          <img src="../assets/imgs/logo2.png" class="side-logo">

          <div class="side-brand-text">
            <span class="side-title">
              Umi<span>Data</span>
            </span>

            <span class="side-user">
              <span id="nomeGestor"></span> •
              <span id="regiaoGestor"></span>
            </span>
          </div>

        </div>

        <!-- MENU -->
        <div class="side-menu">

          <button class="side-btn active">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
          </button>

          <button class="side-btn">
            <i class="fa-solid fa-gear"></i>
            <span>Opções</span>
          </button>

          <button class="side-btn" id="btnAdmin">
            <i class="fa-solid fa-plus"></i>
            <span>Adicionar Estado</span>
          </button>

        </div>

      </div>

      <!-- SAIR -->
      <a href="../index.html" class="side-btn logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sair</span>
      </a>

    </aside>

    <!-- MAIN -->
    <main>

      <!-- KPIs -->
      <section class="kpi-grid" id="kpiGrid"></section>

      <!-- GRID -->
      <section class="dashboard-grid">

        <!-- ESQUERDA -->
        <div class="left-panel">

          <!-- ESTADOS -->
          <div class="v-card">

            <div class="v-head">
              <div class="v-label">
                Estados da Região
              </div>

              <div class="v-sub">
                Clique para selecionar o estado
              </div>
            </div>

            <div id="estadoStatusBar"></div>

            <!-- CARDS -->
            <div id="mapaCards" class="estado-grid"></div>

            <!-- LEGENDA -->
            <div class="mapa-legenda">

              <div class="leg">
                <div class="leg-sq verde"></div>
                Ideal > 60%
              </div>

              <div class="leg">
                <div class="leg-sq amarelo"></div>
                Atenção 30-60%
              </div>

              <div class="leg">
                <div class="leg-sq laranja"></div>
                Alerta 20-30%
              </div>

              <div class="leg">
                <div class="leg-sq vermelho"></div>
                Emergência 12-19%
              </div>

              <div class="leg">
                <div class="leg-sq vinho"></div>
                Crítico < 12%
              </div>

            </div>

          </div>

          <!-- RANKING -->
          <div class="v-card ranking-card">

            <div class="v-head">
              <div class="v-label">
                Ranking
              </div>
            </div>

            <div class="table-wrap">

              <table>

                <thead>
                  <tr>
                    <th>#</th>
                    <th>Estado</th>
                    <th>Umidade</th>
                    <th>Internações</th>
                    <th>Status</th>
                  </tr>
                </thead>

                <tbody id="rankBody"></tbody>

              </table>

            </div>

          </div>

        </div>

        <!-- DIREITA -->
        <div class="right-panel">

          <!-- LINHA -->
          <div class="v-card graph-card">

            <div class="v-head">
              <div class="v-label">
                Evolução da Umidade
              </div>
            </div>

            <div class="chart-wrap">
              <canvas id="lineChart"></canvas>
            </div>

          </div>

          <!-- BARRAS -->
          <div class="v-card graph-card">

            <div class="v-head">
              <div class="v-label">
                Comparativo
              </div>
            </div>

            <div class="chart-wrap">
              <canvas id="barChart"></canvas>
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- MODAL -->
  <div class="modal-ov" id="modalOv">

    <div class="modal-box">

      <div class="modal-title">
        + Adicionar Estado
      </div>

      <div class="fg">
        <label>Nome</label>
        <input id="fNome" />
      </div>

      <div class="fg">
        <label>Sigla</label>
        <input id="fSigla" />
      </div>

      <div class="fg">
        <label>IBGE</label>
        <input id="fIbge" />
      </div>

      <div class="modal-foot">

        <button class="btn btn-c" id="btnCancelar">
          Cancelar
        </button>

        <button class="btn btn-s" id="btnSalvar">
          Salvar
        </button>

      </div>

    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    Salvo
  </div>

  <!-- JS -->
  <script src="../js/dashboard.js"></script>

</body>

</html>
